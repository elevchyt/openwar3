# The checks that need NO game install (issues #303, #394).
#
# OpenWar3 ships zero Blizzard assets, so nothing that reads the Warcraft III data can run
# here. What CAN run is `pnpm test` on a checkout with no install: it typechecks the app and
# the landing page, checks for import cycles and the test plan, runs the relay suite, and runs
# every sim/JASS test the manifest (tools/tests.mjs) does not mark `data` — 170 of 231 when
# this was written. The data-backed tests, `data:verify`, `casc:test` and the other
# install checks skip themselves with a line saying so, and stay the contributor's to run
# locally. `app:test` is skipped too: it needs a `pnpm build`.
#
# A test that starts needing the data fails here; mark it `data: true` in tools/tests.mjs.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      # Nothing below launches the desktop app: skip the ~100 MB Electron binary.
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      # pnpm comes from package.json's `packageManager` pin, so corepack must be on BEFORE
      # setup-node looks for it to key the store cache.
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The landing page is its own package with its own lockfile (web/README.md).
      - run: pnpm --dir web install --frozen-lockfile
      # Continues past a failing check and names every one that failed at the end.
      - run: pnpm test
